# 테스트는 기본으로 stub AI 클라이언트를 쓴다. 운영 설정에는 기본값이 없어 반드시 지정해야 한다.
# (classpath:/config/는 main의 application.yml을 가리지 않고 그 위에 더해진다. 테스트별 @TestPropertySource가 이 값보다 우선한다.)
app.ai.story.client=stub
app.ai.emodi.client=stub
# 기동 때 끝나지 않은 회차 생성·완료를 이어서 돌리지 않는다. 같은 DB를 쓰는 다른 테스트 클래스가 남긴 행을 건드리지 않게 하고,
# 이어서 진행하는 동작은 테스트에서 직접 부른다.
app.ai.story.resume-on-startup=false
