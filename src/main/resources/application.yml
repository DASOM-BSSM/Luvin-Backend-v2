spring:
  datasource:
    # RDS로 옮길 때는 DB_URL을 jdbc:postgresql://<rds-endpoint>:5432/luvin 형태로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luvin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 기존 34개 테이블은 ddl-auto:update가 계속 관리한다(전체 baseline 전환은 별도 범위).
  # 설문 v2용 신규 테이블만 Flyway로 관리 — baseline-on-migrate로 이미 데이터가 있는
  # 기존 DB 위에도 안전하게 처음 적용할 수 있게 한다.
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /openapi.json

app:
  jwt:
    # 운영에서는 반드시 환경변수 JWT_SECRET으로 덮어써야 한다. (HS256이라 최소 32바이트 이상 필요)
    secret: ${JWT_SECRET:local-dev-only-please-change-this-secret-key-before-deploy}
    # 리프레시 토큰이 따로 없어서 access token 하나로 계속 쓰는 구조라 넉넉하게 14일로 잡았다.
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1209600}
  oauth:
    google:
      # ID 토큰 검증(aud claim)에 허용할 클라이언트 ID 목록. 안드로이드/iOS/웹이 각자 다른
      # client-id로 토큰을 발급하므로 전부 나열한다 (콤마로 구분). 비어있으면 로그인 자체가
      # 막힌다 (fail-closed).
      client-ids: ${GOOGLE_CLIENT_IDS:}
      # 웹 OAuth 리디렉션(authorization code) 플로우 전용 — 위 client-ids 중 웹 클라이언트 ID와
      # 동일해야 한다.
      web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # 구글 콘솔의 "승인된 리디렉션 URI"와 정확히 일치해야 한다.
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
    apple:
      # identityToken의 aud 검증에 허용할 값 목록(콤마 구분). 네이티브(iOS)는 앱 번들 ID
      # (Expo app.json의 ios.bundleIdentifier), 웹은 Service ID가 aud로 온다.
      # 비어있으면 애플 로그인이 막힌다 (fail-closed).
      client-ids: ${APPLE_CLIENT_IDS:}
      # 아래 4개는 identityToken 검증에는 쓰이지 않고, Apple REST API(POST /auth/token,
      # POST /auth/revoke) 호출 — 즉 로그인 시 refresh token 발급과 회원 탈퇴 시 그 토큰 해지에만
      # 쓰인다. 비어있어도 로그인 자체는 막지 않는다(best-effort) — 이 호출이 실제로 일어나는
      # 시점에만 예외가 발생한다. Apple Developer 콘솔 "Certificates, Identifiers & Profiles"에서
      # 확인한다.
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      # 네이티브 앱의 번들 ID. client-ids 목록 중 하나와 같아야 한다(토큰 발급/해지 요청의 client_id).
      bundle-id: ${APPLE_BUNDLE_ID:}
      # .p8 키 파일 원문(PEM, PKCS8 EC private key). 환경변수에는 줄바꿈이 "\n" 두 글자 문자열로
      # 들어오는 경우가 흔해 AppleClientSecretGenerator에서 실제 줄바꿈으로 치환한 뒤 파싱한다.
      # 절대 Git에 커밋하지 않는다.
      private-key: ${APPLE_PRIVATE_KEY:}
  cors:
    # 브라우저(웹 프론트)에서 직접 호출할 origin만 나열한다(콤마 구분). 앱(RN/Expo 네이티브)은
    # CORS 제약이 없어 여기 없어도 영향받지 않는다. 비어있으면 모든 브라우저 요청이 막힌다(fail-closed).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  ai:
    # AI 서비스(FastAPI) base url. 지금은 AWS EC2 IP로 직접 지정하고, 추후 내부 도메인으로 전환한다.
    base-url: ${AI_SERVICE_BASE_URL}
    # AI 서비스가 실제로 decimal 성향 점수를 받는지 계약이 확인되기 전까지는 false로 두어
    # AiTraitsWireAdapter가 wire 직전에 정수로 반올림한다. 계약 확인 후에만 true로 바꾼다.
    decimal-traits-enabled: ${AI_DECIMAL_TRAITS_ENABLED:false}
