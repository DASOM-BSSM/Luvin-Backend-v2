spring:
  datasource:
    # RDS로 옮길 때는 DB_URL을 jdbc:postgresql://<rds-endpoint>:5432/luvin 형태로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luvin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /openapi.json

app:
  jwt:
    # 운영에서는 반드시 환경변수 JWT_SECRET으로 덮어써야 한다. (HS256이라 최소 32바이트 이상 필요)
    secret: ${JWT_SECRET:local-dev-only-please-change-this-secret-key-before-deploy}
    # 리프레시 토큰이 따로 없어서 access token 하나로 계속 쓰는 구조라 넉넉하게 14일로 잡았다.
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1209600}
  oauth:
    google:
      # ID 토큰 검증(aud claim)에 허용할 클라이언트 ID 목록. 안드로이드/iOS/웹이 각자 다른
      # client-id로 토큰을 발급하므로 전부 나열한다 (콤마로 구분). 비어있으면 로그인 자체가
      # 막힌다 (fail-closed).
      client-ids: ${GOOGLE_CLIENT_IDS:}
      # 웹 OAuth 리디렉션(authorization code) 플로우 전용 — 위 client-ids 중 웹 클라이언트 ID와
      # 동일해야 한다.
      web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # 구글 콘솔의 "승인된 리디렉션 URI"와 정확히 일치해야 한다.
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
  ai:
    # AI 서비스(FastAPI) base url. 지금은 AWS EC2 IP로 직접 지정하고, 추후 내부 도메인으로 전환한다.
    base-url: ${AI_SERVICE_BASE_URL}
